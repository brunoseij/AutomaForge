name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM tests and static contracts
        run: |
          gradle :app:testDebugUnitTest --no-daemon
          python - <<'PYTEST'
          import runpy
          tests = runpy.run_path('tests/test_static_contract.py')
          for name, fn in tests.items():
              if name.startswith('test_'):
                  fn()
          PYTEST
      - name: Compile debug APK
        run: gradle :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutomaForge-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: app/build/reports/tests/
